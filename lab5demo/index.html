<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Obatoke Temitope – Caterpillar Drawing Final</title>

    <!-- Required library -->
    <script src="d3.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        svg {
            border: 1px solid black;
            background-color: white;
        }

        label {
            display: inline-block;
            width: 110px;
        }
    </style>
</head>

<body>

    <h2>Drawing: Caterpillar</h2>

    <label>Caterpillar X:</label>
    <input type="number" id="xInput" value="200" />
    <br /><br />

    <label>Caterpillar Y:</label>
    <input type="number" id="yInput" value="250" />
    <br /><br />

    <button id="drawButton">Draw!</button>
    <br /><br />

    <svg id="svgCanvas" width="500" height="500"></svg>

    <!-- IMPORTANT: Script order matters -->
    <script src="caterpillar.js"></script>
    <script src="main.js"></script>

</body>
</html>
